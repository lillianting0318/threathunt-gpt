name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      # requirements-dev.txt deliberately excludes faiss / sentence-transformers /
      # torch. conftest.py stubs those heavy modules, so the unit tests run with
      # only numpy + pytest + pytest-mock — no model download, no GPU, no network.
      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest -q

  build-and-push:
    needs: test                       # image is built ONLY if the test job passed
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write                 # lets the built-in GITHUB_TOKEN push to GHCR
    steps:
      - uses: actions/checkout@v5

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ghcr.io/lillianting0318/threathunt-gpt:latest
            ghcr.io/lillianting0318/threathunt-gpt:${{ github.sha }}
